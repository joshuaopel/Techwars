<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TECHWARS – Play</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gw">
  <canvas id="gc"></canvas>

  <!-- ── HUD ──────────────────────────────────────────── -->
  <div id="hud">

    <!-- minimap -->
    <div id="minimap-wrap">
      <canvas id="minimap"></canvas>
    </div>

    <!-- bottom info bar -->
    <div id="bottom-bar">

      <!-- unit panel -->
      <div id="unit-panel" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">
        <canvas id="portrait" width="58" height="58"></canvas>
        <div id="unit-stats">
          <div class="uname" id="uname">SELECT A UNIT OR BUILDING</div>
          <div class="bar-row">
            <span style="font-size:.68rem;opacity:.7">HP</span>
            <div class="bar"><div class="bar-fill hp-fill" id="unit-hp-fill" style="width:100%"></div></div>
          </div>
        </div>
      </div>

      <!-- building panel -->
      <div id="bld-panel" style="display:none;align-items:center;gap:10px;flex:1;min-width:0">
        <canvas id="bld-portrait" width="58" height="58" style="flex-shrink:0"></canvas>
        <div style="min-width:0;flex:1">
          <div class="uname" id="bld-name">BUILDING</div>
          <div class="bar-row" style="margin-bottom:4px">
            <span style="font-size:.68rem;opacity:.7">HP</span>
            <div class="bar"><div class="bar-fill hp-fill" id="bld-hp-fill" style="width:100%"></div></div>
          </div>
          <div id="prod-btns" style="display:flex;gap:4px;flex-wrap:wrap"></div>
        </div>
        <div style="min-width:120px;flex-shrink:0">
          <div style="font-size:.6rem;color:var(--accent);letter-spacing:.1em;margin-bottom:3px">PRODUCTION QUEUE</div>
          <div id="prod-queue"></div>
          <div style="font-size:.6rem;opacity:.4;margin-top:4px">RClick map → set rally</div>
        </div>
      </div>

      <div style="margin-left:auto;flex-shrink:0;font-size:.65rem;opacity:.45;line-height:2;text-align:right;padding-left:12px">
        <div>WASD / ↑↓←→ camera</div>
        <div>LClick select · Drag box</div>
        <div>RClick move / attack</div>
        <div>Click building to produce</div>
      </div>
    </div>

    <!-- objectives -->
    <div id="hotkeys">
      <div style="color:var(--accent);margin-bottom:4px;letter-spacing:.15em">OBJECTIVE</div>
      <div>Destroy the enemy</div>
      <div>Command Center</div>
    </div>

    <!-- floating messages -->
    <div id="msgs"></div>

  </div><!-- /hud -->

  <!-- ── game-over overlay ──────────────────────────── -->
  <div id="overlay">
    <h2 id="overlay-title">VICTORY</h2>
    <p id="overlay-msg" style="font-size:1rem;letter-spacing:.15em;opacity:.8"></p>
    <div class="btn-row">
      <button class="btn green" id="btn-restart">▶ PLAY AGAIN</button>
      <a class="btn" href="editor.html">✎ EDITOR</a>
      <a class="btn" href="index.html">⌂ MENU</a>
    </div>
  </div>

</div><!-- /gw -->

<script src="js/tiles.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
</body>
</html>
